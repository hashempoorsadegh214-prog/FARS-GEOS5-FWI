name: Test NASA GEOS-5

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Test NASA GEOS-5
        run: python scripts/test_nasa_geos5.py

      - name: Show report
        run: cat data/diagnostics/nasa_geos5_links.txt
