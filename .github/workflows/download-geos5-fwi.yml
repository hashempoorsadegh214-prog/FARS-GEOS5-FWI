name: Download NASA GEOS-5 FWI

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date (YYYY-MM-DD). Leave empty for tomorrow."
        required: false
        type: string
        default: ""

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify Fars boundary
        run: |
          echo "Checking fars.geojson..."

          if [ ! -f "fars.geojson" ]; then
            echo "ERROR: fars.geojson not found in repository root."
            exit 1
          fi

          if [ ! -s "fars.geojson" ]; then
            echo "ERROR: fars.geojson is empty."
            exit 1
          fi

          echo "fars.geojson found successfully."
          ls -lh fars.geojson

      - name: Download NASA GEOS-5 FWI
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          python scripts/download_geos5_fwi.py

      - name: Show downloaded files
        run: |
          echo "Downloaded GEOS-5 FWI files:"
          find data/raw/fwi -type f -maxdepth 1 -print -exec ls -lh {} \;

      - name: Commit downloaded FWI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/fwi/

          if git diff --cached --quiet; then
            echo "No new FWI file to commit."
          else
            git commit -m "Download NASA GEOS-5 FWI"
            git push
          fi
