name: Check NASA GEOS-5 2026

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check NASA GEOS-5 2026
        run: |
          python scripts/check_geos5_2026.py

      - name: Show report
        if: always()
        run: |
          echo "=============================================="
          echo "NASA GEOS-5 2026 CHECK REPORT"
          echo "=============================================="

          if [ -f "data/diagnostics/geos5_2026_check.txt" ]; then
            cat data/diagnostics/geos5_2026_check.txt
          else
            echo "Report file was not created."
          fi
